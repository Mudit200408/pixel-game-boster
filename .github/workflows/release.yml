name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release asset and changelog notes
        id: asset
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSET_NAME="pixel-game-booster-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET_NAME"
          python3 -c '
          import re, sys
          tag = sys.argv[1]
          ver = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^##\s+\[?(?:v?{re.escape(ver)}|{re.escape(tag)})\]?.*?\n(.*?)(?=^##\s|\Z)"
          m = re.search(pattern, text, re.M | re.S)
          notes = m.group(1).strip() if m and m.group(1).strip() else f"Release {tag}"
          open("release_notes.md", "w", encoding="utf-8").write(notes + "\n")
          ' "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag }}
          name: ${{ steps.asset.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.asset.outputs.file }}
